# Render blueprint for `proven`.
#
# Two services:
#   proven-proxy — the verifying JSON-RPC endpoint (POST /, GET /status)
#   proven-web   — the static browser verifier
#
# Deploy with: Render Dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: proven-proxy
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node dist/proxy-cli.js
    healthCheckPath: /health
    envVars:
      - key: UPSTREAM_RPC
        value: https://free.rpc.fastnear.com,https://rpc.mainnet.near.org
        # Comma-separated: the first is primary, the rest are failover. Only these two public
        # endpoints answer `next_light_client_block`; most others reject it outright.
      - key: PROVEN_CHECKPOINT
        value: checkpoints/mainnet.json
      # "1" refuses methods that cannot be verified; "0" forwards everything and reports
      # the verdict in `x-proven-verified`.
      - key: PROVEN_STRICT
        value: "0"
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: proven-web
    runtime: static
    buildCommand: npm install && npm run web:build
    staticPublishPath: web/dist
    envVars:
      # The app works against any CORS-enabled NEAR RPC, and a public one has no cold start — point
      # this at the proxy service URL only if you want the app to go through the verifier too.
      - key: VITE_DEFAULT_RPC
        value: https://free.rpc.fastnear.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
